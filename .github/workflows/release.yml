name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version to publish, for example 0.5.0-alpha"
        required: true
        type: string
      title:
        description: "GitHub Release title"
        required: true
        type: string
      prerelease:
        description: "Mark as prerelease"
        required: true
        default: true
        type: boolean
      notes_file:
        description: "Release notes file"
        required: true
        default: "releases/v0.5.1-alpha/release-notes.md"
        type: string

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate requested version
        id: meta
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          REQUESTED_VERSION="${{ inputs.version }}"
          REQUESTED_VERSION="${REQUESTED_VERSION#v}"
          if [ "$PACKAGE_VERSION" != "$REQUESTED_VERSION" ]; then
            echo "package.json version ($PACKAGE_VERSION) does not match workflow input (${{ inputs.version }})." >&2
            exit 1
          fi
          if [ ! -f "${{ inputs.notes_file }}" ]; then
            echo "Release notes file not found: ${{ inputs.notes_file }}" >&2
            exit 1
          fi
          echo "tag=v$REQUESTED_VERSION" >> "$GITHUB_OUTPUT"
      - run: npm run check:web
      - run: npm run check:desktop

  build-windows:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - name: Prepare Python runtime
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt
      - run: npm run release:check
      - run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: editory-windows-x64
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error

  build-macos-arm64:
    needs: validate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - name: Prepare Python runtime
        shell: bash
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt
      - run: npm run check:web
      - run: npm run check:desktop
      - run: npm run build:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: editory-macos-arm64
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error

  publish:
    needs:
      - validate
      - build-windows
      - build-macos-arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          TITLE: ${{ inputs.title }}
          NOTES_FILE: ${{ inputs.notes_file }}
          PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          FLAGS=()
          if [ "$PRERELEASE" = "true" ]; then
            FLAGS+=(--prerelease)
          fi
          gh release create "$TAG" release-assets/* \
            --title "$TITLE" \
            --notes-file "$NOTES_FILE" \
            "${FLAGS[@]}"
