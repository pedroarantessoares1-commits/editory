name: Release macOS

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version to publish, for example 0.5.3-alpha"
        required: true
        type: string
      title:
        description: "GitHub Release title"
        required: false
        type: string
      prerelease:
        description: "Mark as prerelease"
        required: true
        default: true
        type: boolean
      notes_file:
        description: "Release notes file"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          REQUESTED_VERSION="${{ inputs.version }}"
          REQUESTED_VERSION="${REQUESTED_VERSION#v}"

          if [[ -z "$REQUESTED_VERSION" ]]; then
            echo "Release version is required." >&2
            exit 1
          fi

          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$PACKAGE_VERSION" != "$REQUESTED_VERSION" ]]; then
            echo "package.json version ($PACKAGE_VERSION) does not match release version ($REQUESTED_VERSION)." >&2
            exit 1
          fi

          NOTES_FILE="${{ inputs.notes_file }}"
          if [[ -z "$NOTES_FILE" ]]; then
            NOTES_FILE="releases/v${REQUESTED_VERSION}/release-notes.md"
          fi
          if [[ ! -f "$NOTES_FILE" ]]; then
            echo "Release notes file not found: $NOTES_FILE" >&2
            exit 1
          fi

          TITLE="${{ inputs.title }}"
          if [[ -z "$TITLE" ]]; then
            TITLE="Editory v${REQUESTED_VERSION} macOS Apple Silicon"
          fi

          echo "version=$REQUESTED_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$REQUESTED_VERSION" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"
          echo "prerelease=${{ inputs.prerelease }}" >> "$GITHUB_OUTPUT"

      - name: Package macOS app
        run: npm run package:mac

      - name: Verify clean macOS package
        shell: bash
        run: |
          forbidden='(^|/)(data|uploads|jobs|silence|\.env|\.git|\.pytest_cache|\.mypy_cache|\.ruff_cache|__pycache__)(/|$)'

          if find dist -maxdepth 5 \( -name data -o -name uploads -o -name jobs -o -name silence -o -name ".env" \) | grep -q .; then
            echo "Forbidden local data path found in dist/." >&2
            find dist -maxdepth 5 \( -name data -o -name uploads -o -name jobs -o -name silence -o -name ".env" \)
            exit 1
          fi

          for archive in dist/*.zip; do
            [[ -f "$archive" ]] || continue
            if unzip -Z1 "$archive" | grep -E "$forbidden"; then
              echo "Forbidden local data path found inside $archive." >&2
              exit 1
            fi
          done

          echo "Clean package check passed."

      - uses: actions/upload-artifact@v4
        with:
          name: editory-macos-arm64
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest*.yml
            dist/SHA256SUMS-macos-arm64.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          TITLE: ${{ steps.meta.outputs.title }}
          NOTES_FILE: ${{ steps.meta.outputs.notes_file }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists for $TAG." >&2
            exit 1
          fi

          assets=()
          for pattern in dist/*.dmg dist/*.zip dist/*.blockmap dist/latest*.yml dist/SHA256SUMS-macos-arm64.txt; do
            for file in $pattern; do
              [[ -f "$file" ]] && assets+=("$file")
            done
          done

          if [[ "${#assets[@]}" -eq 0 ]]; then
            echo "No macOS release assets found." >&2
            exit 1
          fi

          flags=(--latest=false)
          if [[ "$PRERELEASE" == "true" ]]; then
            flags+=(--prerelease)
          fi

          gh release create "$TAG" "${assets[@]}" \
            --title "$TITLE" \
            --notes-file "$NOTES_FILE" \
            "${flags[@]}"
